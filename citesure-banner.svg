<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" fill="none" role="img" aria-label="CiteSure Banner">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Soft Ambient Lights -->
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowSky" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <style>
      .float-doodle {
        animation: floatMove 4.5s ease-in-out infinite;
        transform-origin: 120px 130px;
      }
      .sparkle {
        animation: sparkleAnim 3s ease-in-out infinite;
      }
      .sparkle-delay {
        animation: sparkleAnim 3s ease-in-out 1.5s infinite;
      }
      @keyframes floatMove {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(2deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes sparkleAnim {
        0%, 100% { opacity: 0.3; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.15); }
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="1000" height="320" rx="20" fill="url(#bgGrad)" />
  <rect width="998" height="318" x="1" y="1" rx="19" stroke="rgba(255,255,255,0.08)" stroke-width="2" fill="none" />

  <!-- Ambient Light Circles -->
  <circle cx="180" cy="80" r="150" fill="url(#glowBlue)" />
  <circle cx="820" cy="160" r="180" fill="url(#glowSky)" />

  <!-- Grid Pattern Overlay -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="320" />
    <line x1="160" y1="0" x2="160" y2="320" />
    <line x1="260" y1="0" x2="260" y2="320" />
    <line x1="360" y1="0" x2="360" y2="320" />
    <line x1="460" y1="0" x2="460" y2="320" />
    <line x1="0" y1="80" x2="1000" y2="80" />
    <line x1="0" y1="160" x2="1000" y2="160" />
    <line x1="0" y1="240" x2="1000" y2="240" />
  </g>

  <!-- Left Content (Branding & Typography) -->
  <g transform="translate(60, 50)">
    <!-- Category Pill -->
    <rect width="154" height="28" rx="14" fill="rgba(37,99,235,0.2)" stroke="#3b82f6" stroke-width="1.2" />
    <circle cx="14" cy="14" r="4" fill="#38bdf8" />
    <text x="26" y="18" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2">ACADEMIC SUITE</text>

    <!-- Main Title -->
    <g transform="translate(0, 72)">
      <!-- Icon Book -->
      <g transform="translate(0, -32) scale(1.35)">
        <rect width="32" height="32" rx="8" fill="url(#accentGrad)" />
        <path d="M9 10C9 8.89543 9.89543 8 11 8H21C22.1046 8 23 8.89543 23 10V22C23 23.1046 22.1046 24 21 24H11C9.89543 24 9 23.1046 9 22V10Z" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round" />
        <path d="M9 19.5H23" stroke="#ffffff" stroke-width="1.8" />
        <path d="M13 12H19" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
        <path d="M13 15.5H17" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
      </g>
      <text x="56" y="2" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">CiteSure</text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="0" y="112" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="16" font-weight="400">Intelligent Citation Verification, Scholarly Evidence &amp; Copyright Safety</text>

    <!-- Core Badges Row -->
    <g transform="translate(0, 148)">
      <!-- Badge 1: Formatting -->
      <g transform="translate(0, 0)">
        <rect width="162" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)" stroke-width="1.2" />
        <text x="81" y="20.5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">APA · MLA · Chicago</text>
      </g>

      <!-- Badge 2: Real APIs -->
      <g transform="translate(176, 0)">
        <rect width="166" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)" stroke-width="1.2" />
        <text x="83" y="20.5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Crossref &amp; OpenAlex</text>
      </g>

      <!-- Badge 3: Safety -->
      <g transform="translate(356, 0)">
        <rect width="176" height="32" rx="16" fill="rgba(20,184,166,0.12)" stroke="rgba(20,184,166,0.35)" stroke-width="1.2" />
        <text x="88" y="20.5" fill="#5eead4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">100% Zero-Fabrication</text>
      </g>
    </g>
  </g>

  <!-- Anchored Right-Side Group: Firmly fixed at X=700 on the right side -->
  <g transform="translate(700, 22)">
    <!-- Floating and Tilting Sub-Group -->
    <g class="float-doodle">
      <!-- Paper Sheet Vector Shadows -->
      <rect x="25" y="25" width="210" height="250" rx="16" fill="#000000" opacity="0.35" />
      <rect x="20" y="20" width="210" height="250" rx="16" fill="#0f172a" opacity="0.5" />
      <rect x="15" y="15" width="210" height="250" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5" />
      
      <!-- Dog Ear Fold -->
      <path d="M185 15 L225 55 L185 55 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" />
      <path d="M185 15 L225 55" stroke="#94a3b8" stroke-width="2" />

      <!-- Document Header & Lines -->
      <rect x="42" y="44" width="70" height="8" rx="4" fill="#2563eb" />
      <rect x="42" y="66" width="130" height="5" rx="2.5" fill="#94a3b8" />
      <rect x="42" y="80" width="150" height="5" rx="2.5" fill="#cbd5e1" />
      <rect x="42" y="94" width="140" height="5" rx="2.5" fill="#cbd5e1" />
      <rect x="42" y="108" width="120" height="5" rx="2.5" fill="#cbd5e1" />

      <!-- Citation Pill with Verified Badge -->
      <g transform="translate(42, 132)">
        <rect width="154" height="34" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" />
        <circle cx="18" cy="17" r="7" fill="#10b981" />
        <path d="M15 17 L17 19 L21 15" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <text x="32" y="21" fill="#1e40af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" font-weight="700">[Smith, 2021] ✓</text>
      </g>

      <!-- Additional Lines -->
      <rect x="42" y="184" width="150" height="5" rx="2.5" fill="#cbd5e1" />
      <rect x="42" y="198" width="135" height="5" rx="2.5" fill="#cbd5e1" />
      <rect x="42" y="212" width="110" height="5" rx="2.5" fill="#cbd5e1" />

      <!-- Paperclip Accent -->
      <path d="M60 5 C60 0, 80 0, 80 5 L80 40 C80 46, 68 46, 68 40 L68 12 C68 9, 74 9, 74 12 L74 35" stroke="#3b82f6" stroke-width="3" fill="none" stroke-linecap="round" />

      <!-- Sparkle Stars -->
      <g transform="translate(195, 110)" class="sparkle">
        <path d="M0 8 L3 0 L6 8 L14 11 L6 14 L3 22 L0 14 L-8 11 Z" fill="#38bdf8" />
      </g>
      <g transform="translate(0, 180)" class="sparkle-delay">
        <path d="M0 6 L2 0 L4 6 L10 8 L4 10 L2 16 L0 10 L-6 8 Z" fill="#14b8a6" />
      </g>
    </g>
  </g>
</svg>
